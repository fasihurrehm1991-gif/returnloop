{% extends 'base.html' %}

{% block title %}Password Updated | ReturnLoop{% endblock %}

{% block content %}

<style>

    .complete-section {
        min-height: 75vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 55px 20px;
    }

    .complete-card {
        width: 100%;
        max-width: 540px;
        background: #ffffff;
        padding: 50px 40px;
        border-radius: 22px;
        text-align: center;
        box-shadow: 0 15px 45px rgba(16, 55, 43, 0.12);
    }

    .complete-icon {
        width: 75px;
        height: 75px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 25px;
        border-radius: 50%;
        background: #e3f5ec;
        color: #087f5b;
        font-size: 35px;
    }

    .complete-card .eyebrow {
        color: #087f5b;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 12px;
    }

    .complete-card h1 {
        color: #10372b;
        font-size: 30px;
        font-weight: 750;
        margin-bottom: 15px;
    }

    .complete-description {
        color: #637b6e;
        font-size: 14px;
        line-height: 1.9;
        margin-bottom: 28px;
    }

    .complete-button {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 10px;
        background: #087f5b;
        color: white;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: 0.25s;
    }

    .complete-button:hover {
        background: #07543e;
        color: white;
        transform: translateY(-2px);
    }

    @media (max-width: 576px) {
        .complete-card {
            padding: 35px 22px;
        }
    }

</style>


<section class="complete-section">

    <div class="complete-card">

        <div class="complete-icon">
            ✓
        </div>

        <p class="eyebrow">Account Security</p>

        <h1>Password Updated!</h1>

        <p class="complete-description">
            Your ReturnLoop account password has been changed
            successfully. You can now sign in using your new
            password.
        </p>

        <a href="{% url 'login' %}" class="complete-button">
            Sign In to ReturnLoop →
        </a>

    </div>

</section>

{% endblock %}
